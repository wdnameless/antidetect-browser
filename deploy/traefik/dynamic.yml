# Dynamic routing: everything arriving at http://10.8.0.1 goes to the
# antidetect service on the host loopback. WebSocket upgrades (/cdp/*,
# /cdp-view/*) are forwarded by default.
http:
  routers:
    antidetect:
      rule: "Host(`10.8.0.1`)"
      entryPoints:
        - web
      service: antidetect-svc

  services:
    antidetect-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:50325"
