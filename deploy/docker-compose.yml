# Traefik reverse proxy for the Antidetect service.
#
# The antidetect service itself runs natively on the host (NSSM) because the
# fingerprint kernel is a Windows binary that needs a desktop session:
# it cannot live inside a container. Traefik only routes traffic to it.
#
# Requires: WireGuard tunnel up with server address 10.8.0.1
# (see docs/SERVER_DEPLOY.md step 3).
services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    ports:
      # Bind to the WG interface only — nothing reachable outside the VPN.
      - "10.8.0.1:80:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      # Linux-engine Docker needs this to reach the host loopback service;
      # Docker Desktop provides it automatically.
      - "host.docker.internal:host-gateway"
