name: "Contributor License Agreement"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Skip running on bots or closed non-merged PRs
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby accept the CLA') || github.event_name == 'pull_request_target'
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby accept the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dedicated GitHub App or Personal Access Token with repo scope for storing CLA signatures
          # Operator: Configure these secrets in repository settings (Settings -> Secrets and variables -> Actions)
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'cla/signatures.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'bot*|*bot,dependabot[bot],renovate[bot]'
          # Optional GitHub App credentials if using GitHub App instead of Personal Access Token:
          # app-id: ${{ secrets.CLA_APP_ID }}
          # app-private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
