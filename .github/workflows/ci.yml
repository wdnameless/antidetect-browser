name: CI

on:
  push:
    branches: [main]
    # The release job below is gated on `refs/tags/v*`. Without this trigger that gate
    # can never be true, so no tag has ever produced a release — v0.3.0 through v0.3.4
    # were documented in the changelog and never shipped. A tag push starts the workflow.
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify SBOM and Supply Chain
        run: npm run sbom:verify

  sdk:
    name: SDK Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck Node SDK
        run: npm run typecheck

      - name: Run Node SDK & Conformance tests
        run: npx vitest run tests/unit/sdk

      - name: Install Python SDK
        run: pip install -e "packages/sdk-python[dev]"

      - name: Run Python SDK tests
        run: python -m pytest packages/sdk-python/tests -q

  release:
    name: Release Tauri Desktop Shell (${{ matrix.os }})
    # Build and publish release artefacts when a v* tag is pushed.
    #
    # Windows only, and that is a deliberate, recorded limitation rather than an
    # oversight. Upstream browser kernel downloads and verification are Windows-only;
    # shipping unverified platform builds is worse than not shipping them.
    #
    # macOS (arm64) and Linux targets are configured (bundle.macOS.signingIdentity="-" ad-hoc,
    # linux categories/targets), but configuration only — no artefacts published (R10).
    # Note that macOS ad-hoc signing is configured though unsigned here.
    #
    # Matrix entries for ubuntu-latest and macos-14 remain commented out below: upstream
    # platform kernel downloads and host test harnesses are not available in CI, and shipping
    # unverified platform builds is worse than not shipping them.
    #
    # matrix:
    #   - os: ubuntu-latest
    #     platform: linux
    #   - os: macos-14
    #     platform: mac
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sdk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: NullTrace-tauri-win-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Tauri CLI
        run: npx tauri --version

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build backend, renderer and vendored runtime
        run: npm run build && npm run copy:prod-deps && npm run vendor:node

      - name: Build Tauri shell and portable artefact
        run: npx tauri build --bundles nsis && npm run tauri:build:portable

      - name: Test Tauri shell backend tests
        run: npx vitest run tests/unit/tauriShell.test.ts tests/unit/tauriBridgeAndShell.test.ts

      - name: Test Tauri Rust shell
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Both artefacts land in the same directory: `tauri build` writes the NSIS installer,
      # and `tauri:build:portable` compiles our own portable launcher beside it. There is no
      # separate portable output directory — an earlier revision globbed a path nothing
      # created, which would have published an empty release.
      #
      # Updater metadata. Signed with a minisign key whose PUBLIC half is embedded in
      # src-tauri/tauri.conf.json. The private key must be a repository secret; without it
      # the step is skipped rather than emitting an unsigned manifest, because a latest.json
      # with an empty signature makes the updater refuse every release while the UI reports
      # the check as fine — worse than having no updater metadata at all.
      # Written in PowerShell because the runner is Windows and the step is declared
      # `shell: pwsh`. The previous version was a mixture: a bash `$(ls ... | head -1)`
      # assignment followed by backtick line continuations and a `.Replace()` call, which
      # pwsh cannot parse. It never ran, because the step is skipped without a signing key —
      # so the first release that actually had secrets was the first to fail here.
      - name: Build updater manifest
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $setup = (Get-ChildItem src-tauri/target/release/bundle/nsis -Filter 'NullTrace_*_x64-setup.exe' | Select-Object -First 1).FullName
          if (-not $setup) { throw 'NSIS installer not found; cannot build the updater manifest.' }
          $version = '${{ github.ref_name }}'.Replace('v', '')
          $leaf = Split-Path $setup -Leaf
          node scripts/build-updater-manifest.mjs `
            --version $version `
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$leaf" `
            --artefact $setup `
            --out dist-release
        shell: pwsh

      - name: Note missing signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: |
          echo "::notice title=Updater metadata skipped::TAURI_SIGNING_PRIVATE_KEY is not configured, so latest.json was not produced. In-app updates will report 'not configured' rather than failing."
        shell: bash

      - name: Upload Tauri artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-release/*
          if-no-files-found: error

      # Publish release assets to GitHub release on tagged push.
      #
      # `latest.json` and the `.sig` are included when they were produced above; the updater
      # endpoint resolves to `releases/latest/download/latest.json`, so the asset must sit at
      # the release root. Without a signing key they are simply absent and the app reports
      # updates as "not configured" — an honest state rather than a failing one.
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-release/latest.json
            dist-release/*.sig
          fail_on_unmatched_files: false
