name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron@44 dropped its postinstall hook, so the binary is fetched
      # lazily by the first require('electron') — which happens inside the
      # security suites, within their 20s test timeout. Provision it up front.
      - name: Provision Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify SBOM and Supply Chain
        run: npm run sbom:verify

  sdk:
    name: SDK Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck Node SDK
        run: npm run typecheck

      - name: Run Node SDK & Conformance tests
        run: npx vitest run tests/unit/sdk

      - name: Install Python SDK
        run: pip install -e "packages/sdk-python[dev]"

      - name: Run Python SDK tests
        run: python -m pytest packages/sdk-python/tests -q

  release:
    # Build and publish the Windows installer when a v* tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sdk]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
