name: CI

on:
  push:
    branches: [main]
    # The release job below is gated on `refs/tags/v*`. Without this trigger that gate
    # can never be true, so no tag has ever produced a release — v0.3.0 through v0.3.4
    # were documented in the changelog and never shipped. A tag push starts the workflow.
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron@44 dropped its postinstall hook, so the binary is fetched
      # lazily by the first require('electron') — which happens inside the
      # security suites, within their 20s test timeout. Provision it up front.
      - name: Provision Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify SBOM and Supply Chain
        run: npm run sbom:verify

  sdk:
    name: SDK Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck Node SDK
        run: npm run typecheck

      - name: Run Node SDK & Conformance tests
        run: npx vitest run tests/unit/sdk

      - name: Install Python SDK
        run: pip install -e "packages/sdk-python[dev]"

      - name: Run Python SDK tests
        run: python -m pytest packages/sdk-python/tests -q

  release:
    # Build and publish installer-free artefacts when a v* tag is pushed.
    #
    # Windows only, and that is a deliberate, recorded limitation rather than an
    # oversight. The build scripts are Windows-hardcoded in three places:
    #   - scripts/ensure-chromedriver.mjs fetches `win64/chromedriver-win64.zip`
    #   - scripts/ensure-kernel.mjs pins `ungoogled-chromium_..._windows_x64.zip` and its
    #     SHA256, so any other platform fails the digest check
    #   - src/main/config.ts looks for `chrome.exe` and only falls back to
    #     `Google\Chrome\Application\chrome.exe`
    # Upstream does publish Linux and macOS kernels, so this is fixable — but it cannot be
    # verified from here (no Linux or macOS runner in this workspace), and shipping an
    # unverified platform build is worse than not shipping one. Linux/macOS stay in the
    # matrix comment, not in the build, until they can be built and checked.
    #
    # No signing credentials are required or expected.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sdk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: NullTrace-portable-win-x64
          # Tracked as a gap, not enabled: adding `linux`/`mac` here today produces a
          # build that fails on the pinned Windows kernel digest.
          # - os: ubuntu-latest
          #   platform: linux
          #   artifact: NullTrace-portable-linux-x64
          # - os: macos-14
          #   platform: mac
          #   artifact: NullTrace-portable-mac-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A platform-specific break must be caught here rather than shipped, so the
      # gates run on every runner, not just the Windows one.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The kernel/chromedriver fetch must run explicitly. npm only fires `pre<name>` for
      # the exact script name, and we no longer call `dist:win`, so `predist:win` would
      # never run — and a build without the kernel silently falls back to system Chrome,
      # which is the defect this release exists to fix.
      - name: Prepare kernel and driver
        run: npm run predist:${{ matrix.platform }}

      # `dist/` is gitignored, so a fresh checkout has no bundle at all. Compile it before
      # packaging — main and renderer both.
      - name: Build application bundle
        run: npm run build

      # electron-builder auto-detects CI and attempts its own GitHub publish, which then
      # fails for a missing GH_TOKEN and kills the build before the artefact exists.
      # `--publish never` stops the build at the artefact — softprops below does the publish.
      # Verified this does NOT suppress `latest.yml`: a --publish never run emits it with
      # the correct sha512 and size, which is what electron-updater needs.
      - name: Build installer and portable artefact
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

      # `latest.yml` and the blockmap MUST be published alongside the installer: this is
      # what electron-updater fetches to discover and verify an update. A release carrying
      # only the .exe cannot update itself — the in-app update check reports "latest" while
      # a newer version exists, silently.
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          fail_on_unmatched_files: false

  tauri:
    name: Tauri Desktop Shell (Additive / Non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Tauri shell test
        run: npx vitest run tests/unit/tauriShell.test.ts

      - name: Test sidecar lifecycle module
        run: cargo test --manifest-path src-tauri/Cargo.toml
