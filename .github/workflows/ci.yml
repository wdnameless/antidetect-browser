name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron@44 dropped its postinstall hook, so the binary is fetched
      # lazily by the first require('electron') — which happens inside the
      # security suites, within their 20s test timeout. Provision it up front.
      - name: Provision Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify SBOM and Supply Chain
        run: npm run sbom:verify

  sdk:
    name: SDK Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck Node SDK
        run: npm run typecheck

      - name: Run Node SDK & Conformance tests
        run: npx vitest run tests/unit/sdk

      - name: Install Python SDK
        run: pip install -e "packages/sdk-python[dev]"

      - name: Run Python SDK tests
        run: python -m pytest packages/sdk-python/tests -q

  release:
    # Build and publish installer-free artefacts when a v* tag is pushed.
    # Linux and macOS artefacts cannot be produced on Windows, so each platform
    # builds on its own runner. No signing credentials are required or expected:
    # the macOS artefact ships unsigned (we have no Apple Developer account), so
    # the job must not fail for lack of them.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sdk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: NullTrace-portable-win-x64
          - os: ubuntu-latest
            platform: linux
            artifact: NullTrace-portable-linux-x64
          - os: macos-14
            platform: mac
            artifact: NullTrace-portable-mac-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A platform-specific break must be caught here rather than shipped, so the
      # gates run on every runner, not just the Windows one.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build portable artefact for ${{ matrix.platform }}
        run: npm run dist:${{ matrix.platform }}

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          fail_on_unmatched_files: false
