name: Probe macOS kernel

# Answers one question with measurements instead of assumption: can the pinned
# fingerprint-chromium kernel run on Apple Silicon at all, and does it behave?
#
# Why a workflow rather than a local script: the probe must run on a REAL arm64 Mac. The only
# one available to this project is GitHub's `macos-14` runner, which is M1. Windows cannot
# produce a macOS build, and nothing about the kernel's behaviour under Rosetta can be
# measured from a Windows host.
#
# Manual dispatch only. It downloads a 134 MB image and launches a browser, so it must not run
# on every push.
on:
  workflow_dispatch:

jobs:
  probe:
    name: Kernel probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon (M1). macos-13 = Intel, run as the native-x86_64 control:
        # the pinned asset is an x86_64 image, so Intel is the one host where it needs no
        # translation — comparing the two is what separates "works" from "works only emulated".
        os: [macos-14, macos-13]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Host facts
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n sysctl.proc_translated || echo "proc_translated unavailable"

      - name: Run the kernel probe
        id: probe
        continue-on-error: true
        run: node scripts/probe-macos-kernel.mjs 2>&1 | tee probe-output.txt

      - name: Extract the report
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("probe-output.txt", "utf8");
            const m = text.match(/--- PROBE_JSON_BEGIN ---\n([\s\S]*?)\n--- PROBE_JSON_END ---/);
            if (!m) { console.log("NO_REPORT_FOUND"); process.exit(0); }
            const r = JSON.parse(m[1]);
            console.log("=== SUMMARY ===");
            console.log("host        :", JSON.stringify(r.host));
            console.log("arch        :", JSON.stringify(r.checks?.architecture));
            console.log("runs natively:", r.checks?.runs_natively);
            console.log("signature   :", (r.checks?.signature?.info || "").split("\n")[0]);
            console.log("launched    :", r.checks?.launch?.launched);
            console.log("proc arch   :", r.checks?.launch?.processArch);
            console.log("surface     :", JSON.stringify(r.checks?.launch?.surface));
            console.log("flags work  :", r.checks?.fingerprint_flags_effective);
            console.log("webdriver   :", r.checks?.webdriver_false, "(false = stealth intact)");
            if (r.fatal) console.log("FATAL       :", r.fatal);
            console.log("=== STEPS ===");
            for (const s of r.steps || []) console.log(` ${s.ok ? "OK  " : "FAIL"} ${s.name}: ${s.detail ?? ""}`);
          '

      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-kernel-probe-${{ matrix.os }}
          path: |
            probe-output.txt
          if-no-files-found: warn

  accept:
    name: Kernel acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # The acceptance script imports the COMPILED module, so it must exist. Building only the
      # backend keeps this fast: the renderer is irrelevant to the kernel path.
      - name: Build the backend
        run: npm run build:main

      # This is the real thing: a real download, a real digest check, a real hdiutil mount and a
      # real browser launch. No stubs. If this passes, the macOS kernel path works.
      - name: Run the kernel acceptance script
        id: accept
        continue-on-error: true
        run: node scripts/e2e-macos-kernel.mjs 2>&1 | tee e2e-output.txt

      - name: Report
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("e2e-output.txt", "utf8");
            const m = text.match(/--- E2E_JSON_BEGIN ---\n([\s\S]*?)\n--- E2E_JSON_END ---/);
            if (!m) { console.log("NO_REPORT"); process.exit(0); }
            const r = JSON.parse(m[1]);
            console.log(r.allPassed ? "ALL CHECKS PASSED" : "SOME CHECKS FAILED");
            for (const c of r.results) console.log(` ${c.ok ? "OK  " : "FAIL"} ${c.name}: ${c.detail ?? ""}`);
          '

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-kernel-acceptance
          path: e2e-output.txt
          if-no-files-found: warn

  build-app:
    name: Build the macOS app bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Vendor the Node sidecar (arm64)
        run: npm run vendor:node

      - name: Build backend and renderer
        run: npm run build && npm run copy:prod-deps

      # The step that proves the port: this is a full Tauri compile for arm64 plus the bundle
      # layout, on the platform it targets. Everything else in this workflow verifies pieces;
      # this one verifies that the application itself builds here.
      - name: Build the app bundle
        id: build
        continue-on-error: true
        run: npx tauri build --bundles app 2>&1 | tail -40

      - name: Inspect the bundle
        if: always()
        run: |
          set -x
          ls -la src-tauri/target/release/bundle/macos/ 2>/dev/null || echo "NO BUNDLE DIRECTORY"
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "::warning::no .app produced"; exit 0; fi
          echo "bundle: $APP"
          lipo -archs "$APP/Contents/MacOS/"* || true
          codesign --verify --deep --strict "$APP" && echo "SIGNATURE OK" || echo "SIGNATURE FAILED"
          # The bundled Node sidecar must be there and be arm64, or the shell starts to an error.
          ls -la "$APP/Contents/Resources/binaries/" 2>/dev/null || echo "no binaries dir"
          for b in "$APP/Contents/Resources/binaries/"*; do [ -f "$b" ] && lipo -archs "$b"; done 2>/dev/null || true
          du -sh "$APP"

      - name: Package the portable layout
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/package-macos-portable.mjs --app src-tauri/target/release/bundle/macos

      - name: Upload whatever was produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-bundle
          path: |
            src-tauri/target/release/bundle/macos/
            dist-release/
          if-no-files-found: warn
