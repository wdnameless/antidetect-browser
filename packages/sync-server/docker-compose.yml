services:
  sync-server:
    build: .
    image: antidetect-sync-server:latest
    container_name: antidetect-sync
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      SYNC_DATA_DIR: /data
      NODE_ENV: production
      RATE_LIMIT_MAX: "60"
      RATE_LIMIT_WINDOW_MS: "60000"
    volumes:
      - sync-data:/data

volumes:
  sync-data:
